[project]
name = "cuota"
version = "0.1.0"
description = "Monitor de cuotas (ventana 5 h, semanal, mensual) de suscripciones de IA, en la terminal."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cuota = "cuota.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuota"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
