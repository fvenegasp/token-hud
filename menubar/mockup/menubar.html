*{box-sizing:border-box;margin:0}
body{background:#1b1d22;color:#ddd;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;padding:16px 24px 40px}
h2{font:600 12px -apple-system,Helvetica,sans-serif;color:#9aa0aa;letter-spacing:.04em;text-transform:uppercase;margin:22px 0 8px}
.scene{position:relative;width:1300px;height:620px;border-radius:10px;overflow:hidden}
.scene.dark{background:linear-gradient(135deg,#1d2b4a,#3b2a55 55%,#12141c)}
.scene.light{background:linear-gradient(135deg,#f4e6c8,#f1b98c 50%,#d7e6f3)}
/* ---- menu bar (24 px a 1x) ---- */
.bar{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;gap:0;
  font:500 13px -apple-system,"SF Pro Text",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.dark .bar{background:rgba(20,20,24,.62);color:#fff;backdrop-filter:blur(20px)}
.light .bar{background:rgba(245,245,247,.55);color:#000;backdrop-filter:blur(20px)}
.sys{display:flex;align-items:center;height:24px;padding:0 7px}
.sys svg{height:13px;width:auto;fill:currentColor}
.clock{padding:0 8px 0 10px;white-space:nowrap}
.item{position:relative;display:flex;align-items:center;gap:4px;height:24px;padding:0 6px;border-radius:5px;cursor:default}
.item.open{background:rgba(255,255,255,.22)}
.light .item.open{background:rgba(0,0,0,.14)}
.item .lg{width:14px;height:14px;flex:none;color:inherit}
.item .lg svg{width:14px;height:14px;display:block}
.item .n{display:flex;flex-direction:column;justify-content:center;font:600 10px/10px ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.2px;text-align:right;min-width:23px}
.item.blocked{opacity:.45}
.item.stale{opacity:.72}
.item.err{padding-right:15px}
.item .bad{position:absolute;right:2px;top:2px;width:8px;height:8px;border-radius:50%;background:currentColor;display:grid;place-items:center}
.item .bad b{font:800 7px/1 -apple-system,Helvetica,sans-serif;color:#222}
.dark .item .bad b{color:#1a1a1e}.light .item .bad b{color:#f2f2f4}
/* ---- dropdown ---- */
.menu{position:absolute;top:27px;width:410px;padding:6px;border-radius:10px;font:13px/1.3 -apple-system,"SF Pro Text",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.dark .menu{background:rgba(44,44,48,.86);color:#f2f2f4;backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px rgba(255,255,255,.22),0 10px 34px rgba(0,0,0,.5)}
.light .menu{background:rgba(238,238,240,.86);color:#1d1d1f;backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px rgba(0,0,0,.22),0 10px 34px rgba(0,0,0,.28)}
.prov{padding:5px 10px 6px;border-radius:5px}
.prov:hover{background:#0a63d8;color:#fff}
.prov .h{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:1px}
.prov .h svg{width:13px;height:13px}
.prov .h .pl{font-weight:400;opacity:.6}
.prov .r{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.prov .r.m{opacity:.7}
.prov.blocked .h{opacity:.55}
.bl{color:#ff6259}.light .bl{color:#d1261b}.ok{color:#4cd964}.light .ok{color:#1b8a37}.wr{color:#ffb340}.light .wr{color:#b56a00}.er{color:#ff6259}.light .er{color:#d1261b}
.prov:hover .bl,.prov:hover .ok,.prov:hover .wr,.prov:hover .er{color:inherit}
.sep{height:1px;margin:5px 8px;background:rgba(128,128,128,.32)}
.mi{position:relative;display:flex;justify-content:space-between;padding:4px 10px;border-radius:5px}
.mi:hover{background:#0a63d8;color:#fff}
.mi .k{opacity:.55;font-size:12px}
.tag{position:absolute;right:100%;top:3px;margin-right:12px;white-space:nowrap;font:600 10px/1 -apple-system,Helvetica,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border:1px dashed #f5a623;color:#f5a623;border-radius:4px;background:rgba(0,0,0,.35)}
.note{position:absolute;left:24px;bottom:16px;font:12px/1.5 -apple-system,Helvetica,sans-serif;color:rgba(255,255,255,.85);background:rgba(0,0,0,.42);padding:8px 12px;border-radius:6px;max-width:430px}
.light .note{color:#222;background:rgba(255,255,255,.6)}

const day=fmt({weekday:'short'}), hm=fmt({hour:'2-digit',minute:'2-digit',hour12:false}), ymd=fmt({year:'numeric',month:'2-digit',day:'2-digit'}), dm=fmt({day:'numeric',month:'short'});
