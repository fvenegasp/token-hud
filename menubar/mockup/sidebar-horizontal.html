function dur(ms){const m=Math.round(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;
  return d?`${d} d ${h} h`:h?`${h} h ${mi} min`:`${mi} min`;}
const ago=t=>{const m=Math.round((NOW-Date.parse(t))/6e4);return m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`};
const rem=w=>w?Math.max(0,Math.round(100-w.used_pct)):null;
const win=(p,k)=>p.windows.find(w=>w.kind===k);
const pace=(p,key)=>{const e=p.pace&&Object.entries(p.pace).find(([k])=>k===key||k.startsWith(key+':'));return e?e[1]:null};
function model(id,p){
  const second=id==='kimi'?'monthly':'weekly';
  const w5=win(p,'5h'), w2=win(p,second);
  const blocked=(w2&&w2.state==='exhausted')||(w5&&w5.state==='exhausted');
  return {p,w5,w2,second,blocked,top:!w5||w5.state==='idle'?'—':rem(w5), bot:w2?rem(w2):'—',
    stale:p.status==='stale', err:p.status==='error'};
}
function paceTxt(p,key){const v=pace(p,key);if(!v)return '';
  if(v.verdict==='se_agota'&&v.projected_exhaust_at)return ` · <span class="bl">se agota ${when(Date.parse(v.projected_exhaust_at))}</span>`;
  if(v.verdict==='sobre_ritmo'&&v.ratio!=null)return ` · <span class="wr">${v.ratio.toFixed(1).replace('.',',')}× sobre ritmo</span>`;
  if(v.verdict==='bajo_ritmo')return ` · <span class="ok">alcanza</span>`;return '';}
/* mismo bloque que el menú de menubar.html */
function block(id,name,icon,m){
  const {p,w5,w2,second}=m, lab=second==='monthly'?'Mensual':'Semanal';
  let l5,l2;
  if(m.blocked){const w=(w2&&w2.state==='exhausted')?w2:w5,t=Date.parse(w.resets_at);
    l5=`5 h: <span class="bl">bloqueada hasta ${when(t)} (${dur(t-NOW)})</span>`;
    l2=`${lab}: ${rem(w2)} % restante · ${w2.state==='exhausted'?'vuelve':'reinicia'} ${when(Date.parse(w2.resets_at))}`;}
  else{
    l5=!w5?'':w5.state==='idle'?'5 h: sin ventana activa':`5 h: ${rem(w5)} % restante${paceTxt(p,'5h')}`;
    l2=`${lab}: ${rem(w2)} % restante · reinicia ${when(Date.parse(w2.resets_at))}${paceTxt(p,second)}`;}
  const fr=m.err?`<span class="er">error: ${p.error} · último valor bueno de hace ${ago(p.fetched_at)}</span>`
    :m.stale?`<span class="wr">dato desactualizado · hace ${ago(p.fetched_at)}</span>`:`dato de hace ${ago(p.fetched_at)}`;
  return `<div class="prov ${m.blocked?'blocked':''}"><div class="h"><svg><use href="#${icon}"/></svg>${name}${PLAN[id]?`<span class="pl">· ${PLAN[id]}</span>`:''}</div>
   ${l5?`<div class="r">${l5}</div>`:''}<div class="r">${l2}</div><div class="r m">${fr}</div></div>`;
}
function item(id,icon,m,open){
  const cls=['item',m.blocked?'blocked':'',m.stale?'stale':'',open?'open':''].join(' ');
  return `<div class="${cls}" data-id="${id}"><span class="lg"><svg><use href="#${icon}"/></svg></span><span class="n"><span>${m.top}</span><span>${m.bot}</span></span></div>`;
}
/* medidor: largo = % restante; color = veredicto de ritmo */
const VC={bajo_ritmo:'c-ok',sobre_ritmo:'c-wr',se_agota:'c-bl',agotada:'c-bl',sin_datos:'c-nd'};
function meter(p,w,key){
  if(!w||w.state==='idle')return `<div class="mt"></div>`;
  const v=pace(p,key), r=rem(w), c=w.state==='exhausted'?'c-bl':VC[v&&v.verdict]||'c-nd';
  return `<div class="mt ${r===0?'zero':''}"><i class="${c}" style="width:${r}%"></i></div>`;
}
function row(id,icon,m,hov){
  const cls=['row',m.blocked?'blocked':'',m.stale?'stale':'',hov?'hov':''].join(' ');
  return `<div class="${cls}" data-id="${id}"><svg class="lg"><use href="#${icon}"/></svg>${m.err?'<span class="bad">!</span>':''}
   <div class="ln"><u>5h</u><b>${m.top}</b></div>${meter(m.p,m.w5,'5h')}
   <div class="ln"><u>${m.second==='monthly'?'mes':'sem'}</u><b>${m.bot}</b></div>${meter(m.p,m.w2,m.second)}</div>`;
}
const SYS=`<div class="sys"><svg viewBox="0 0 24 13"><path d="M2 0h18a2 2 0 012 2v9a2 2 0 01-2 2H2a2 2 0 01-2-2V2a2 2 0 012-2zm.6 1.2A1.4 1.4 0 001.2 2.6v7.8a1.4 1.4 0 001.4 1.4h16.8a1.4 1.4 0 001.4-1.4V2.6a1.4 1.4 0 00-1.4-1.4zM3 2.6h16v7.8H3zM23 4.2c.9.3 1.4 1 1.4 2.3s-.5 2-1.4 2.3z" fill-rule="evenodd"/></svg></div>
<div class="sys"><svg viewBox="0 0 20 14"><path d="M10 2.6c2.7 0 5.1 1 6.9 2.8l1.2-1.3A11.600 11.600 0 0010 .8 11.600 11.600 0 001.900 4.100l1.200 1.300A9.800 9.800 0 0110 2.600zm0 3.600c1.700 0 3.200.6 4.400 1.700l1.200-1.300A8.100 8.100 0 0010 4.400a8.100 8.100 0 00-5.600 2.200l1.200 1.300A6.300 6.300 0 0110 6.200zm0 3.600c.8 0 1.500.3 2 .8L10 12.700 8 10.600c.5-.5 1.200-.8 2-.8z"/></svg></div>`;
const OTHER=Array(8).fill('<div class="sys"><span class="dot"></span></div>').join('');
const PTR=`<svg class="ptr" viewBox="0 0 18 24"><path d="M1 1v19l5-4.6 3.2 7.2 3-1.3-3.1-7h6.9z" fill="#000" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
/* nivel restante: >50 verde, 20–50 ámbar, <20 rojo */
const lvl=r=>r>50?'k-ok':r>=20?'k-wr':'k-bl';
const warn=(p,key)=>{const v=pace(p,key);return v&&(v.verdict==='se_agota'||v.verdict==='sobre_ritmo')};
function hline(lab,p,w,key){
  if(!w||w.state==='idle')return `<div class="ln"><u>${lab}</u><b class="nd">—</b></div><div class="mt"></div>`;
  const r=rem(w);
  return `<div class="ln"><u>${lab}${warn(p,key)?'<em>▲</em>':''}</u><b class="${lvl(r)}">${r}<small>%</small></b></div>
   <div class="mt ${r===0?'zero':''}"><i class="${lvl(r)}" style="width:${r?Math.max(r,4):0}%"></i></div>`;
}
function cell(id,icon,m,hov){
  return `<div class="cell ${m.blocked?'blocked':''} ${m.stale?'stale':''} ${hov?'hov':''}" data-id="${id}"><svg class="lg"><use href="#${icon}"/></svg>
   <div class="lines">${hline('5h',m.p,m.w5,'5h')}${hline(m.second==='monthly'?'mes':'sem',m.p,m.w2,m.second)}</div></div>`;
}
const DOCKC=['#3a82f7','#34c759','#ff9f0a','#af52de','#ff375f','#5ac8fa','#8e8e93','#ffd60a','#30b0c7','#64d2ff'];
const dock=v=>`<div class="dock ${v?'v':''}">${DOCKC.slice(0,v?8:10).map(c=>`<i style="background:linear-gradient(160deg,${c},${c}99)"></i>`).join('')}</div>`;
const NOTES={
 bottom:`<b>Borde inferior, con Dock abajo.</b><ul>
  <li>Barra horizontal (NSPanel no activante), alto 56 pt en tamaño Normal; centrada; a 6 pt sobre el Dock.</li>
  <li>Se ancla al marco visible de la pantalla (excluye barra de menú y Dock): nunca los tapa, queda pegada a ellos.</li>
  <li>Celda por proveedor: logo a la izquierda, "5h" y "sem" (Kimi: "mes") con % restante y medidor de 4 pt; color por nivel (&gt;50 verde, 20–50 ámbar, &lt;20 rojo); "▲" ámbar si a este ritmo se agota antes.</li>
  <li>Asa vertical a la izquierda: arrastrar mueve la barra en horizontal a lo largo del borde; la posición se recuerda por orientación.</li>
  <li>Tamaños (alto): Compacto 43 pt · Normal 56 pt · Grande 72 pt (proporcionales a los anchos verticales 64 / 84 / 108 pt).</li></ul>`,
 nodock:`<b>Borde inferior, sin Dock abajo</b> (Dock a un costado u oculto).<ul>
  <li>Regla: la barra usa el marco visible. Si el Dock no ocupa el borde inferior, el marco llega al borde de la pantalla y la barra queda a 6 pt de él.</li>
  <li>Con el Dock en ocultación automática, la barra también queda al borde inferior y el Dock la cubre al aparecer.</li>
  <li>Si el Dock cambia de lugar o de tamaño, la barra se reubica sola.</li></ul>`,
 top:`<b>Borde superior, apariencia clara.</b><ul>
  <li>A 6 pt bajo la barra de menú, centrada; queda debajo de la zona del notch sin ocultarse, porque está fuera de la barra de menú.</li>
  <li>Puntero sobre Claude (~300 ms): el globo se abre hacia abajo, hacia el centro de la pantalla (en el borde inferior, hacia arriba).</li>
  <li>Cambiar de borde reorienta la barra: vertical en derecho / izquierdo, horizontal en superior / inferior.</li></ul>`,
 menu:`<b>Menú desde la barra horizontal.</b><ul>
  <li>Clic en el asa o en una celda (o clic secundario) abre el menú hacia arriba en el borde inferior (hacia abajo en el superior).</li>
  <li>"Borde de la barra lateral" suma Superior e Inferior; al cambiar se reorienta y conserva su posición por orientación.</li>
  <li>"Mostrar en" (⌥⌘L alterna) y "Tamaño" sin cambios; el tamaño aplica igual en horizontal (43 / 56 / 72 pt de alto).</li></ul>`};
function scene(kind,scen){
  const S=JSON.parse(JSON.stringify(S0));
  const M=ORDER.map(([id,n,ic])=>[id,n,ic,model(id,S.providers[id])]);
  const hb=`<div class="hb"><div class="grip ${scen==='menu'?'on':''}"><i></i></div>${M.map(([id,,ic,m])=>cell(id,ic,m,scen==='top'&&id==='claude')).join('')}</div>`;
  const pop=scen==='top'?`<div class="pop">${block(...M[0])}</div>${PTR}`:scen==='menu'?PTR:'';
  const chk=(c,t,tag)=>`<div class="mi"><span><span class="c">${c?'✓':''}</span>${t}</span>${tag?'<span class="tag">propuesta</span>':''}</div>`;
  const menu=scen!=='menu'?'':`<div class="menu">${M.map(([id,n,ic,m])=>block(id,n,ic,m)).join('<div class="sep"></div>')}
   <div class="sep"></div>
   <div class="mi hd"><span>Mostrar en <span class="k">&nbsp;·&nbsp; ⌥⌘L alterna</span></span></div>
   ${chk(0,'Barra de menú')}${chk(1,'Barra lateral')}
   <div class="mi hd"><span>Borde de la barra lateral</span></div>
   ${chk(0,'Derecho')}${chk(0,'Izquierdo')}${chk(0,'Superior',1)}${chk(1,'Inferior',1)}
   <div class="mi hd"><span>Tamaño de la barra lateral</span></div>
   ${chk(0,'Compacto')}${chk(1,'Normal')}${chk(0,'Grande')}
   <div class="sep"></div>
   <div class="mi"><span>Abrir panel</span></div><div class="mi"><span>Actualizar ahora</span></div>
   <div class="sep"></div><div class="mi"><span>Salir</span><span class="k">⌘Q</span></div></div>`;
  return `<div class="scene ${kind}" data-s="${scen}">
  <div class="bar"><div class="apps"><span style="font-size:15px"></span><b>Finder</b><span>Archivo</span><span>Edición</span><span>Visualización</span><span>Ir</span><span>Ventana</span><span>Ayuda</span></div>
   <div class="right">${OTHER}${SYS}<div class="sys"><span>100 %</span></div><div class="clock">mar 29 sep&nbsp; 17:55</div></div></div>
  <div class="notch"></div>${scen==='top'?'':dock(scen==='nodock')}${hb}${pop}${menu}<div class="note">${NOTES[scen]}</div></div>`;
}
const P=new URLSearchParams(location.search), q=P.get('v');
if(P.get('shot'))document.body.classList.add('shot');
const V={bottom:['1 · Oscura, borde inferior con Dock','dark'],nodock:['2 · Oscura, borde inferior sin Dock abajo','dark'],top:['3 · Clara, borde superior, puntero sobre Claude','light'],menu:['4 · Menú desde la barra horizontal','dark']};
const want=q?q.split(','):Object.keys(V);
document.getElementById('root').innerHTML=want.filter(k=>V[k]).map(k=>`<div class="wrap"><h2>${V[k][0]}</h2>${scene(V[k][1],k)}</div>`).join('');
/* layout: marco visible = pantalla − barra de menú (37) − Dock */
document.querySelectorAll('.scene').forEach(s=>{
  const sc=s.dataset.s, W=1512, H=982, GAP=6, R=s.getBoundingClientRect(), rel=el=>{const r=el.getBoundingClientRect();return {x:r.left-R.left,y:r.top-R.top,w:r.width,h:r.height}};
  const tag=(html,st)=>s.insertAdjacentHTML('beforeend',`<span class="tag free" style="${st}">${html}</span>`);
  const guide=(y,st='')=>s.insertAdjacentHTML('beforeend',`<div class="guide" style="top:${y}px;${st}"></div>`);
  let visTop=37, visBottom=H, visLeft=0;
  const d=s.querySelector('.dock');
  if(d){if(d.classList.contains('v')){d.style.left='4px';d.style.top=((H+37-d.offsetHeight)/2)+'px';visLeft=4+d.offsetWidth+4;}
    else{d.style.left=((W-d.offsetWidth)/2)+'px';d.style.bottom='4px';visBottom=H-4-d.offsetHeight-4;}}
  const hb=s.querySelector('.hb'), bw=hb.offsetWidth, bx=visLeft+(W-visLeft-bw)/2;
  const by=sc==='top'?visTop+GAP:visBottom-GAP-hb.offsetHeight;
  hb.style.left=bx+'px';hb.style.top=by+'px';
  if(sc==='bottom'){guide(visBottom);tag('borde del marco visible (sobre el Dock)',`left:${bx+bw+16}px;top:${visBottom-22}px`);
    tag('propuesta · inferior, 6 pt sobre el Dock, 56 pt de alto',`left:${bx}px;top:${by-28}px`);}
  if(sc==='nodock'){guide(H-1);tag('sin Dock abajo: marco visible = borde de pantalla',`left:${bx+bw+16}px;top:${H-30}px`);
    tag('propuesta · inferior, 6 pt del borde',`left:${bx}px;top:${by-28}px`);}
  if(sc==='top'){guide(37);tag('propuesta · superior, 6 pt bajo la barra de menú',`left:${bx+bw+16}px;top:${by+20}px`);
    const c=rel(s.querySelector('.cell.hov')),pop=s.querySelector('.pop');
    pop.style.left=(c.x-16)+'px';pop.style.top=(by+hb.offsetHeight+10)+'px';pop.style.setProperty('--ax',(c.w/2+10)+'px');
    const p=s.querySelector('.ptr');p.style.left=(c.x+14)+'px';p.style.top=(c.y+30)+'px';}
  if(sc==='menu'){const g=rel(s.querySelector('.grip')),m=s.querySelector('.menu');
    m.style.left=(g.x-4)+'px';m.style.top=Math.max(44,by-6-m.offsetHeight)+'px';
    const p=s.querySelector('.ptr');p.style.left=(g.x+6)+'px';p.style.top=(g.y+22)+'px';}
  const n=s.querySelector('.note');
  if(sc==='menu'||sc==='top'){n.style.right='24px';n.style.top='120px';}
  else{n.style.left=(visLeft+24)+'px';n.style.top='120px';}
});
</script></body></html>
