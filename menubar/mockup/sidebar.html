.scene.dark{background:linear-gradient(135deg,#1d2b4a,#3b2a55 55%,#12141c)}
.scene.light{background:linear-gradient(135deg,#f4e6c8,#f1b98c 50%,#d7e6f3)}
/* ---- menu bar (37 pt con notch) ---- */
.bar{position:absolute;left:0;right:0;top:0;height:37px;display:flex;align-items:center;padding:0 8px;font:500 13px -apple-system,"SF Pro Text",Helvetica,sans-serif}
.dark .bar{background:rgba(20,20,24,.62);color:#fff;backdrop-filter:blur(20px)}
.light .bar{background:rgba(245,245,247,.55);color:#000;backdrop-filter:blur(20px)}
.apps{display:flex;gap:18px;padding-left:12px}.apps b{font-weight:700}
.right{margin-left:auto;display:flex;align-items:center}
.notch{position:absolute;left:656px;top:0;width:200px;height:32px;background:#000;border-radius:0 0 14px 14px;z-index:5}
.sys{display:flex;align-items:center;height:24px;padding:0 7px}

.dot{width:15px;height:15px;border-radius:4px;border:1.6px solid currentColor;opacity:.9}

.item{position:relative;display:flex;align-items:center;gap:4px;height:24px;padding:0 6px;border-radius:5px}

.item.open{background:rgba(255,255,255,.22)}.light .item.open{background:rgba(0,0,0,.14)}
.item .lg svg{width:14px;height:14px;display:block}
.item .n{display:flex;flex-direction:column;font:600 10px/10px ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.2px;text-align:right;min-width:23px}
.item.blocked,.row.blocked{opacity:.45}
.item.stale,.row.stale{opacity:.72}
/* ---- barra lateral (NSPanel) ---- */
.side{position:absolute;width:60px;padding:4px 0 6px;border-radius:12px;z-index:3}

.row{position:relative;padding:7px 7px 8px;margin:0 3px;border-radius:7px}
.row+.row::before{content:"";position:absolute;left:5px;right:5px;top:0;height:.5px;background:currentColor;opacity:.2}

.ln{display:flex;align-items:baseline;justify-content:space-between;line-height:12px}

.ln b{font:600 11px ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.3px}

.mt i{display:block;height:100%;border-radius:2px}
.mt.zero{background:rgba(255,98,89,.35)}.light .mt.zero{background:rgba(209,38,27,.28)}
.c-ok{background:#4cd964}.c-wr{background:#ffb340}.c-bl{background:#ff6259}.c-nd{background:#8e8e93}

  if(ymd(d)===ymd(NOW+864e5))return 'mañana '+hm(d);
  const w=cap(day(d));return (Math.abs(t-NOW)<7*864e5? w:w+' '+cap(dm(d)))+' '+hm(d);}
function dur(ms){const m=Math.round(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;
  return d?`${d} d ${h} h`:h?`${h} h ${mi} min`:`${mi} min`;}
const ago=t=>{const m=Math.round((NOW-Date.parse(t))/6e4);return m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`};
const rem=w=>w?Math.max(0,Math.round(100-w.used_pct)):null;
const win=(p,k)=>p.windows.find(w=>w.kind===k);
const pace=(p,key)=>{const e=p.pace&&Object.entries(p.pace).find(([k])=>k===key||k.startsWith(key+':'));return e?e[1]:null};
function model(id,p){
  const second=id==='kimi'?'monthly':'weekly';
  const w5=win(p,'5h'), w2=win(p,second);
  const blocked=(w2&&w2.state==='exhausted')||(w5&&w5.state==='exhausted');
  return {p,w5,w2,second,blocked,top:!w5||w5.state==='idle'?'—':rem(w5), bot:w2?rem(w2):'—',
    stale:p.status==='stale', err:p.status==='error'};
}
function paceTxt(p,key){const v=pace(p,key);if(!v)return '';
  if(v.verdict==='se_agota'&&v.projected_exhaust_at)return ` · <span class="bl">se agota ${when(Date.parse(v.projected_exhaust_at))}</span>`;
  if(v.verdict==='sobre_ritmo'&&v.ratio!=null)return ` · <span class="wr">${v.ratio.toFixed(1).replace('.',',')}× sobre ritmo</span>`;
  if(v.verdict==='bajo_ritmo')return ` · <span class="ok">alcanza</span>`;return '';}
/* mismo bloque que el menú de menubar.html */
function block(id,name,icon,m){
  const {p,w5,w2,second}=m, lab=second==='monthly'?'Mensual':'Semanal';
  let l5,l2;
  if(m.blocked){const w=(w2&&w2.state==='exhausted')?w2:w5,t=Date.parse(w.resets_at);
    l5=`5 h: <span class="bl">bloqueada hasta ${when(t)} (${dur(t-NOW)})</span>`;
    l2=`${lab}: ${rem(w2)} % restante · ${w2.state==='exhausted'?'vuelve':'reinicia'} ${when(Date.parse(w2.resets_at))}`;}
  else{
    l5=!w5?'':w5.state==='idle'?'5 h: sin ventana activa':`5 h: ${rem(w5)} % restante${paceTxt(p,'5h')}`;
    l2=`${lab}: ${rem(w2)} % restante · reinicia ${when(Date.parse(w2.resets_at))}${paceTxt(p,second)}`;}
  const fr=m.err?`<span class="er">error: ${p.error} · último valor bueno de hace ${ago(p.fetched_at)}</span>`
    :m.stale?`<span class="wr">dato desactualizado · hace ${ago(p.fetched_at)}</span>`:`dato de hace ${ago(p.fetched_at)}`;
  return `<div class="prov ${m.blocked?'blocked':''}"><div class="h"><svg><use href="#${icon}"/></svg>${name}${PLAN[id]?`<span class="pl">· ${PLAN[id]}</span>`:''}</div>
   ${l5?`<div class="r">${l5}</div>`:''}<div class="r">${l2}</div><div class="r m">${fr}</div></div>`;
}
function item(id,icon,m,open){
  const cls=['item',m.blocked?'blocked':'',m.stale?'stale':'',open?'open':''].join(' ');
  return `<div class="${cls}" data-id="${id}"><span class="lg"><svg><use href="#${icon}"/></svg></span><span class="n"><span>${m.top}</span><span>${m.bot}</span></span></div>`;
}
/* medidor: largo = % restante; color = veredicto de ritmo */
const VC={bajo_ritmo:'c-ok',sobre_ritmo:'c-wr',se_agota:'c-bl',agotada:'c-bl',sin_datos:'c-nd'};
function meter(p,w,key){
  if(!w||w.state==='idle')return `<div class="mt"></div>`;
  const v=pace(p,key), r=rem(w), c=w.state==='exhausted'?'c-bl':VC[v&&v.verdict]||'c-nd';
  return `<div class="mt ${r===0?'zero':''}"><i class="${c}" style="width:${r}%"></i></div>`;
}
function row(id,icon,m,hov){
  const cls=['row',m.blocked?'blocked':'',m.stale?'stale':'',hov?'hov':''].join(' ');
  return `<div class="${cls}" data-id="${id}"><svg class="lg"><use href="#${icon}"/></svg>${m.err?'<span class="bad">!</span>':''}
   <div class="ln"><u>5h</u><b>${m.top}</b></div>${meter(m.p,m.w5,'5h')}
   <div class="ln"><u>${m.second==='monthly'?'mes':'sem'}</u><b>${m.bot}</b></div>${meter(m.p,m.w2,m.second)}</div>`;
}
const SYS=`<div class="sys"><svg viewBox="0 0 24 13"><path d="M2 0h18a2 2 0 012 2v9a2 2 0 01-2 2H2a2 2 0 01-2-2V2a2 2 0 012-2zm.6 1.2A1.4 1.4 0 001.2 2.6v7.8a1.4 1.4 0 001.4 1.4h16.8a1.4 1.4 0 001.4-1.4V2.6a1.4 1.4 0 00-1.4-1.4zM3 2.6h16v7.8H3zM23 4.2c.9.3 1.4 1 1.4 2.3s-.5 2-1.4 2.3z" fill-rule="evenodd"/></svg></div>
<div class="sys"><svg viewBox="0 0 20 14"><path d="M10 2.6c2.7 0 5.1 1 6.9 2.8l1.2-1.3A11.600 11.600 0 0010 .8 11.600 11.600 0 001.900 4.100l1.200 1.300A9.800 9.800 0 0110 2.600zm0 3.600c1.700 0 3.200.6 4.400 1.700l1.200-1.300A8.100 8.100 0 0010 4.400a8.100 8.100 0 00-5.600 2.200l1.200 1.300A6.300 6.300 0 0110 6.200zm0 3.600c.8 0 1.500.3 2 .8L10 12.700 8 10.600c.5-.5 1.200-.8 2-.8z"/></svg></div>`;
const OTHER=Array(8).fill('<div class="sys"><span class="dot"></span></div>').join('');
const PTR=`<svg class="ptr" viewBox="0 0 18 24"><path d="M1 1v19l5-4.6 3.2 7.2 3-1.3-3.1-7h6.9z" fill="#000" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const NOTES={
 dark:`<b>Barra lateral, plegada (por defecto).</b><ul>
  <li>NSPanel de 60 pt de ancho, anclado al borde derecho con 6 pt de margen y centrado verticalmente; esquinas de 12 pt, material translúcido, borde de 0,5 px y sombra suave.</li>
  <li>Una fila por proveedor: logo, 5 h arriba y semanal abajo (Kimi: mensual), cada cifra con un medidor del % restante coloreado por ritmo (verde alcanza, ámbar sobre ritmo, rojo se agota / agotada, gris sin datos).</li>
  <li>Mismos estados que la barra de menú: bloqueada al 45 % (Codex, GLM), desactualizada al 72 %, error con "!" y últimos valores buenos, 5 h en reposo "—".</li>
  <li>Siempre visible y no activante (no toma el foco); presente en todos los Espacios; ocultar en apps a pantalla completa es opcional.</li>
  <li>Se arrastra desde el asa a lo largo del borde; la posición se recuerda. Clic en el asa o en una fila (o clic secundario) abre el menú de Token HUD; ⌥-clic abre el panel web.</li>
  <li>Modos excluyentes: con la barra lateral activa, Token HUD no aparece en la barra de menú (solo iconos del sistema y el notch).</li></ul>`,
 hover:`<b>Puntero sobre una fila (Claude).</b><ul>
  <li>Tras ~300 ms aparece a la izquierda un globo con el mismo bloque del menú: plan, 5 h con ritmo u hora de desbloqueo, semanal/mensual con proyección, antigüedad del dato.</li>
  <li>El globo no activa la app y se cierra al salir de la fila. Con anclaje izquierdo, se abre hacia la derecha.</li></ul>`,
 light:`<b>Apariencia clara.</b> Sigue el modo del sistema; mismo material translúcido y mismas reglas de estado. Ancho 60 pt, borde derecho, margen 6 pt.`,
 menu:`<b>Menú abierto desde la barra lateral.</b><ul>
  <li>En modo barra lateral no hay ítems en la barra de menú: el menú se abre con clic en el asa o en una fila (o clic secundario), a la izquierda de la barra (a la derecha si está en el borde izquierdo).</li>
  <li>"Mostrar en": Barra de menú / Barra lateral, opciones excluyentes; ⌥⌘L alterna entre ambas. La elección se recuerda entre sesiones.</li>
  <li>Volver a "Barra de menú" oculta la barra lateral y restaura los ítems de estado.</li>
  <li>"Borde: derecho / izquierdo" solo aplica en modo barra lateral; al cambiar de borde se conserva la posición vertical.</li></ul>`,
 error:`<b>Variante con error.</b> Kimi con error (valores conservados + "!") y Gemini desactualizado (72 %). Codex y GLM bloqueados (45 %).`};
function scene(kind,scen){
  const S=JSON.parse(JSON.stringify(S0));
  if(scen==='error'){const k=S.providers.kimi;k.status='error';k.error='HTTP 401';k.fetched_at='2026-09-29T20:43:00Z';
    const a=S.providers.agy;a.status='stale';a.fetched_at='2026-09-29T20:08:00Z';}
  const M=ORDER.map(([id,n,ic])=>[id,n,ic,model(id,S.providers[id])]);
  const side=`<div class="side"><div class="grip${scen==='menu'?' on':''}"><i></i></div>${M.map(([id,,ic,m])=>row(id,ic,m,scen==='hover'&&id==='claude')).join('')}</div>`;
  const pop=scen==='hover'?`<div class="pop">${block(...M[0])}</div>${PTR}`:scen==='menu'?PTR:'';
  const menu=scen!=='menu'?'':`<div class="menu">${M.map(([id,n,ic,m])=>block(id,n,ic,m)).join('<div class="sep"></div>')}
   <div class="sep"></div>
   <div class="mi hd"><span><span class="c"></span>Mostrar en</span><span class="k">⌥⌘L alterna</span><span class="tag">propuesta</span></div>
   <div class="mi sub"><span><span class="c"></span>Barra de menú</span></div>
   <div class="mi sub hl"><span><span class="c">✓</span>Barra lateral</span></div>
   <div class="mi hd"><span><span class="c"></span>Borde de la barra lateral</span><span class="tag">propuesta</span></div>
   <div class="mi sub"><span><span class="c">✓</span>Derecho</span></div>
   <div class="mi sub"><span><span class="c"></span>Izquierdo</span></div>
   <div class="sep"></div>
   <div class="mi"><span>Abrir panel</span><span class="k">127.0.0.1:6739</span><span class="tag">propuesta · opcional</span></div>
   <div class="mi"><span>Actualizar ahora</span><span class="k">cuota collect</span><span class="tag">propuesta · opcional</span></div>
   <div class="sep"></div><div class="mi"><span>Salir</span><span class="k">⌘Q</span></div></div>`;
  const winEl=`<div class="win"><div class="tb"><i></i><i></i><i></i></div>${Array(14).fill(0).map((_,i)=>`<div class="ln2" style="width:${[70,55,82,40,64,90,33,58,76,47,68,52,80,38][i]}%"></div>`).join('')}</div>`;
  return `<div class="scene ${kind}" data-s="${scen}">${winEl}
  <div class="bar"><div class="apps"><span style="font-size:15px"></span><b>Finder</b><span>Archivo</span><span>Edición</span><span>Visualización</span><span>Ir</span><span>Ventana</span><span>Ayuda</span></div>
   <div class="right">${OTHER}${SYS}<div class="sys"><span>100 %</span></div><div class="clock">mar 29 sep&nbsp; 17:55</div></div></div>
  <div class="notch"></div>${side}${pop}${menu}<div class="note">${NOTES[scen]}</div></div>`;
}
const P=new URLSearchParams(location.search), q=P.get('v');
if(P.get('shot'))document.body.classList.add('shot');
const V={dark:['1 · Oscura, plegada','dark','dark'],hover:['2 · Oscura, puntero sobre Claude','dark','hover'],light:['3 · Clara, plegada','light','light'],menu:['4 · Menú desde la barra lateral','dark','menu'],error:['Variante con error (oscura)','dark','error']};
const want=q?q.split(','):Object.keys(V);
document.getElementById('root').innerHTML=want.filter(k=>V[k]).map(k=>{const [t,kind,sc]=V[k];return `<div class="wrap"><h2>${t}</h2>${scene(kind,sc)}</div>`}).join('');
/* layout: ocultar ítems bajo el notch, anclar barra lateral, globo, menú */
document.querySelectorAll('.scene').forEach(s=>{
  const R=s.getBoundingClientRect(), rel=el=>{const r=el.getBoundingClientRect();return {x:r.left-R.left,y:r.top-R.top,w:r.width,h:r.height}};
  s.insertAdjacentHTML('beforeend',`<span class="tag free" style="left:870px;top:42px">sin ítems en la barra de menú (modo barra lateral)</span>`);
  const sd=s.querySelector('.side'), top=37+(982-37-sd.offsetHeight)/2;

    const p=s.querySelector('.ptr');p.style.left=(g.x+g.w/2)+'px';p.style.top=(g.y+4)+'px';}
});
